# =============================================================================
# BUCHHALTUNG - Docker Compose Production Configuration
# =============================================================================
# Usage:
#   Development:  docker compose up -d
#   Production:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   Build:        docker compose build --no-cache
#   Logs:         docker compose logs -f buchhaltung
#   Stop:         docker compose down
#   With volumes: docker compose down -v (CAUTION: deletes data!)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Main Application
  # ---------------------------------------------------------------------------
  buchhaltung:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buchhaltung-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/prod.db
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      # API CORS Configuration
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      # Optional: Email configuration
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
    volumes:
      # Persist database
      - buchhaltung-data:/app/data
      # Persist uploaded files
      - buchhaltung-uploads:/app/public/uploads
    # Run init container to fix permissions on first run
    user: "1001:1001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    # Note: read_only removed to allow Prisma migrations and SQLite writes
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - buchhaltung-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# -----------------------------------------------------------------------------
# Volumes - Persistent Storage
# -----------------------------------------------------------------------------
volumes:
  buchhaltung-data:
    driver: local
    name: buchhaltung-data
  buchhaltung-uploads:
    driver: local
    name: buchhaltung-uploads

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  buchhaltung-network:
    driver: bridge
    name: buchhaltung-network
