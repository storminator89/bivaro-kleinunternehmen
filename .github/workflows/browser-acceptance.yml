name: Browser acceptance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functional:
    name: Full functional Chromium acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Install Chromium and system dependencies
        shell: bash
        run: |
          # Bound transport stalls for these commands only; keep the runner's sources and trust settings.
          apt_config="$(mktemp "${RUNNER_TEMP:?RUNNER_TEMP is required}/bivaro-apt-XXXXXX.conf")"
          trap 'rm -f -- "$apt_config"' EXIT
          cat > "$apt_config" <<'APT'
          Acquire::Retries "1";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          APT
          # APT_CONFIG is read before system fragments. Preserve stricter runner bounds.
          actual_settings="$(sudo env APT_CONFIG="$apt_config" apt-config shell BIVARO_APT_RETRIES Acquire::Retries BIVARO_APT_HTTP_TIMEOUT Acquire::http::Timeout BIVARO_APT_HTTPS_TIMEOUT Acquire::https::Timeout)"
          printf '%s\n' "$actual_settings"
          mapfile -t settings_lines <<< "$actual_settings"
          if (( ${#settings_lines[@]} != 3 )) ||
             [[ "${settings_lines[0]}" != "BIVARO_APT_RETRIES='1'" ]] ||
             [[ ! "${settings_lines[1]}" =~ ^BIVARO_APT_HTTP_TIMEOUT=\'([1-9]|1[0-9]|20)\'$ ]] ||
             [[ ! "${settings_lines[2]}" =~ ^BIVARO_APT_HTTPS_TIMEOUT=\'([1-9]|1[0-9]|20)\'$ ]]; then
            echo '::error::Unexpected per-command APT transport settings.'
            exit 1
          fi
          node_bin="$(command -v node)"
          playwright_cli="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}/node_modules/playwright/cli.js"
          test -x "$node_bin"
          test -f "$playwright_cli"
          # Playwright's own sudo escalation drops environment variables. Run only its
          # exact installed dependency installer as root; browser downloads stay non-root.
          sudo env APT_CONFIG="$apt_config" "$node_bin" "$playwright_cli" install-deps chromium
          "$node_bin" "$playwright_cli" install chromium

      # PDF/A verification needs Java; real PDF preview needs headed Chromium/Xvfb.
      - name: Install and verify PDF and virtual display dependencies
        shell: bash
        run: |
          apt_config="$(mktemp "${RUNNER_TEMP:?RUNNER_TEMP is required}/bivaro-apt-XXXXXX.conf")"
          trap 'rm -f -- "$apt_config"' EXIT
          cat > "$apt_config" <<'APT'
          Acquire::Retries "1";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          APT
          actual_settings="$(sudo env APT_CONFIG="$apt_config" apt-config shell BIVARO_APT_RETRIES Acquire::Retries BIVARO_APT_HTTP_TIMEOUT Acquire::http::Timeout BIVARO_APT_HTTPS_TIMEOUT Acquire::https::Timeout)"
          printf '%s\n' "$actual_settings"
          mapfile -t settings_lines <<< "$actual_settings"
          if (( ${#settings_lines[@]} != 3 )) ||
             [[ "${settings_lines[0]}" != "BIVARO_APT_RETRIES='1'" ]] ||
             [[ ! "${settings_lines[1]}" =~ ^BIVARO_APT_HTTP_TIMEOUT=\'([1-9]|1[0-9]|20)\'$ ]] ||
             [[ ! "${settings_lines[2]}" =~ ^BIVARO_APT_HTTPS_TIMEOUT=\'([1-9]|1[0-9]|20)\'$ ]]; then
            echo '::error::Unexpected per-command APT transport settings.'
            exit 1
          fi
          sudo env APT_CONFIG="$apt_config" apt-get update
          sudo env APT_CONFIG="$apt_config" apt-get install -y --no-install-recommends xvfb xauth default-jre-headless util-linux poppler-utils
          command -v Xvfb
          command -v xvfb-run
          command -v xauth
          xauth -V
          sh scripts/assert-no-ghostscript.sh

      - name: Install hash-pinned official offline invoice validator
        run: node scripts/einvoice-validation/install-runtime.mjs "${{ runner.temp }}/bivaro-einvoice"

      - name: Install hash-pinned official own-invoice PDF-A verifier
        run: node scripts/own-invoice-pdfa/install-runtime.mjs "${{ runner.temp }}/bivaro-verapdf"

      # Use the supported runner: it owns a fresh temporary database and cleanup.
      # Security hardening remains in CI / Security checks (see testing docs).
      - name: Run the complete functional suite
        timeout-minutes: 25
        env:
          BIVARO_EINVOICE_ASSETS: ${{ runner.temp }}/bivaro-einvoice
          BIVARO_VERAPDF_BIN: ${{ runner.temp }}/bivaro-verapdf/verapdf
          BIVARO_RUN_OWN_INVOICE_PDFA_BROWSER: '1'
          BIVARO_OWN_INVOICE_BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/bivaro-own-invoice-browser
        run: >-
          xvfb-run --auto-servernum npm run test:e2e --
          --headed
          --workers=1
          --retries=0
          --forbid-only
          --global-timeout=1200000
          --reporter=github
          --trace=off
          --output="${{ runner.temp }}/bivaro-browser-results"

      - name: Require both real final-byte browser cases and render all their PDF pages
        env:
          EVIDENCE: ${{ runner.temp }}/bivaro-own-invoice-browser
        run: |
          for viewport in desktop mobile; do
            directory="$EVIDENCE/$viewport"
            node -e 'const fs=require("node:fs"),c=require("node:crypto"),p=process.argv[1],m=require(p+"/manifest.json"),h=c.createHash("sha256").update(fs.readFileSync(p+"/final.pdf")).digest("hex"); if(m.status!=="passed" || h!==m.finalSha256 || h!==m.downloadedSha256 || h!==m.storedSha256) throw Error("Incomplete real browser final-byte evidence")' "$directory"
            mkdir "$directory/rendered"
            pdftoppm -scale-to 2000 -png "$directory/final.pdf" "$directory/rendered/final"
          done

      - name: Retain only synthetic own-invoice final-byte browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: own-invoice-browser-final-bytes
          path: ${{ runner.temp }}/bivaro-own-invoice-browser
          if-no-files-found: warn
          retention-days: 1

      - name: Stage only allowlisted synthetic screenshots
        id: stage-visuals
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes --target "$RUNNER_TEMP/bivaro-evidence-codec" -r scripts/evidence-requirements.txt
          export PYTHONPATH="$RUNNER_TEMP/bivaro-evidence-codec${PYTHONPATH:+:$PYTHONPATH}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import stat
          import sys
          import tempfile
          sys.path.insert(0, 'scripts')
          from lossless_evidence_png import recompress_png_strong as recompress_png

          allowed = {
              'partial-payments-1440-two-events.png',
              'partial-payments-390-two-events.png',
              'partial-reminder-guard-1440.png',
              'partial-reminder-guard-390.png',
              'accountant-guide-1440-readiness.png',
              'accountant-guide-390-manual-note.png',
              'history-correction-desktop.png',
              'history-correction-mobile.png',
              'receipt-draft-mobile.png',
              'receipt-draft-desktop.png',
              'manual-photo-confirmation-mobile.png',
              'manual-photo-expense-desktop.png',
              'annual-context-mobile.png',
              'annual-context-desktop.png',
              'eur-2026-working-paper-1440.png',
              'eur-2026-working-paper-390.png',
              'eur-2027-handoff-390.png',
              'csv-customer-preview-mobile.png',
              'csv-service-catalog-desktop.png',
              'quote-followup-mobile-390.png',
              'quote-followup-desktop-1440.png',
              'ai-receipt-settings-desktop.png',
              'ai-receipt-review-mobile.png',
              'confirmed-reminder-1440.png',
              'confirmed-reminder-390.png',
              'revenue-indicators-amounts-390.png',
              'revenue-indicators-amounts-1440.png',
              'daily-actions-390.png',
              'daily-actions-1440.png',
              'service-plan-review-mobile-390.png',
              'payment-adjustment-confirmation-desktop-1440.png',
              'bank-csv-mapping-desktop-1440.png',
              'bank-csv-results-mobile-390.png',
              'project-services-workbench-desktop-1440.png',
              'project-services-selection-mobile-390.png',
              'incoming-queue-mobile-390.png',
              'incoming-validation-desktop-1440.png',
              'incoming-validation-mobile-390.png',
              'mocked-email-accepted-1440.png',
              'mocked-email-unknown-390.png',
              'receipt-sequence-desktop-1440.png',
              'receipt-sequence-mobile-390.png',
              'record-search-1440.png',
              'record-search-390.png',
              'payment-terms-settings-1440.png',
              'payment-terms-editor-390.png',
              'bank-evidence-saved-1440.png',
              'bank-evidence-reopened-390.png',
              'bank-allocation-confirmation-1440.png',
              'bank-allocation-move-390.png',
              'bank-allocation-current-origin-360.png',
              'customer-timeline-desktop-1440.png',
              'customer-timeline-mobile-360.png',
              'service-statement-preview-1440.png',
              'service-statement-preview-390.png',
          }
          # Bounded output for all 55 known images, including allocation views.
          limit = 8 * 1024 * 1024
          per_file_input_limit = 5 * 1024 * 1024
          root = Path(os.environ['RUNNER_TEMP']) / 'bivaro-browser-results'

          def skip(reason):
              print(f'::warning::Optional synthetic screenshots skipped: {reason}.')
              raise SystemExit(0)

          if root.is_symlink() or not root.is_dir():
              skip('results directory unavailable or unsafe')
          root = root.resolve()
          matches = []
          for directory, subdirs, files in os.walk(root, followlinks=False):
              subdirs[:] = [name for name in subdirs if not (Path(directory) / name).is_symlink()]
              for name in files:
                  if name not in allowed:
                      continue
                  source = Path(directory) / name
                  info = source.lstat()
                  if not stat.S_ISREG(info.st_mode) or not source.resolve().is_relative_to(root):
                      skip('an allowlisted path is not a safe regular file')
                  matches.append((source, info))
          if not matches:
              skip('no allowlisted images were produced')
          if len(matches) > len(allowed) or len({source.name for source, _ in matches}) != len(matches):
              skip('file count exceeds the exact allowlist or basenames are duplicated')
          total = sum(info.st_size for _, info in matches)
          print(f'Synthetic screenshot source bytes: {len(matches)}/{len(allowed)} files, {total} bytes.')
          for source, info in sorted(matches, key=lambda match: match[0].name):
              print(f'Allowlisted synthetic PNG: {source.name} ({info.st_size} bytes).')
          if total > 16 * 1024 * 1024:
              skip('encoded evidence input exceeds its bounded read budget')

          images = {}
          for source, expected in matches:
              fd = os.open(source, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(fd, 'rb') as handle:
                  current = os.fstat(handle.fileno())
                  if not stat.S_ISREG(current.st_mode) or (current.st_dev, current.st_ino) != (expected.st_dev, expected.st_ino):
                      skip('an image changed during staging')
                  data = handle.read(per_file_input_limit + 1)
              if len(data) > per_file_input_limit:
                  skip('an input PNG exceeds the per-file read budget')
              try:
                  data, proof = recompress_png(data)
              except Exception:
                  skip('lossless PNG structure, color metadata or full-pixel verification failed')
              print(f'Lossless PNG proof: {source.name} {json.dumps(proof, sort_keys=True)}')
              images[source.name] = data
              if sum(map(len, images.values())) > limit:
                  skip('combined read size exceeds 8 MiB')
              if not data.startswith(b'\x89PNG\r\n\x1a\n'):
                  skip('an allowlisted file is not a PNG')
          print(f'Synthetic screenshot budget after lossless verification: {len(images)}/{len(allowed)} files, {sum(map(len, images.values()))}/{limit} bytes.')
          staging = Path(tempfile.mkdtemp(prefix='bivaro-synthetic-visuals-', dir=os.environ['RUNNER_TEMP']))
          for name, data in images.items():
              (staging / name).write_bytes(data)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'directory={staging}\nready=true\n')
          print(f'Staged {len(images)} synthetic PNG files ({sum(map(len, images.values()))} bytes).')
          PY

      - name: Upload optional synthetic visual evidence
        id: upload-visuals
        if: ${{ always() && steps.stage-visuals.outputs.ready == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: user-workflows-synthetic-visuals
          path: ${{ steps.stage-visuals.outputs.directory }}
          retention-days: 1
          if-no-files-found: warn
          include-hidden-files: false
          compression-level: 0

      - name: Warn if optional evidence could not be delivered
        if: ${{ always() && (steps.stage-visuals.outcome == 'failure' || steps.upload-visuals.outcome == 'failure') }}
        run: echo '::warning::Optional synthetic visual evidence unavailable. Inspect the staging/upload error (including any artifact quota error); limits were not changed. The functional test result remains authoritative.'
