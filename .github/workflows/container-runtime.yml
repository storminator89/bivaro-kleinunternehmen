name: Container runtime compatibility
on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.ai-browser'
      - 'Dockerfile.ai-browser.dockerignore'
      - '.dockerignore'
      - 'playwright.ai-pdf.config.ts'
      - 'e2e/ai-receipt-native.spec.ts'
      - 'next.config.ts'
      - 'docker-entrypoint.sh'
      - 'scripts/database-runtime.mjs'
      - 'scripts/upgrade-database.mjs'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/container-runtime-smoke.sh'
      - 'scripts/assert-no-ghostscript.sh'
      - 'scripts/ai-pdf/**'
      - 'lib/purchase-documents/**'
      - 'lib/ai-provider/**'
      - 'components/purchases/**'
      - 'app/api/purchase-documents/**'
      - 'app/api/settings/ai-provider/**'
      - 'scripts/run-e2e.mjs'
      - 'scripts/e2e-*.mjs'
      - 'scripts/prepare-e2e.mjs'
      - 'lib/prisma.ts'
      - 'lib/password.ts'
      - 'e2e/own-invoice-*.spec.ts'
      - 'scripts/own-invoice-pdfa/**'
      - 'lib/server/own-invoice-*.ts'
      - 'lib/own-invoice-source.ts'
      - 'lib/pdfa3.ts'
      - 'lib/zugferd-generator.ts'
      - 'app/api/invoices/render/**'
      - 'public/fonts/invoice/**'
      - 'lib/__tests__/fixtures/incoming-validation/**'
      - '.github/workflows/container-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.ai-browser'
      - 'Dockerfile.ai-browser.dockerignore'
      - '.dockerignore'
      - 'playwright.ai-pdf.config.ts'
      - 'e2e/ai-receipt-native.spec.ts'
      - 'next.config.ts'
      - 'docker-entrypoint.sh'
      - 'scripts/database-runtime.mjs'
      - 'scripts/upgrade-database.mjs'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/container-runtime-smoke.sh'
      - 'scripts/assert-no-ghostscript.sh'
      - 'scripts/ai-pdf/**'
      - 'lib/purchase-documents/**'
      - 'lib/ai-provider/**'
      - 'components/purchases/**'
      - 'app/api/purchase-documents/**'
      - 'app/api/settings/ai-provider/**'
      - 'scripts/run-e2e.mjs'
      - 'scripts/e2e-*.mjs'
      - 'scripts/prepare-e2e.mjs'
      - 'lib/prisma.ts'
      - 'lib/password.ts'
      - 'e2e/own-invoice-*.spec.ts'
      - 'scripts/own-invoice-pdfa/**'
      - 'lib/server/own-invoice-*.ts'
      - 'lib/own-invoice-source.ts'
      - 'lib/pdfa3.ts'
      - 'lib/zugferd-generator.ts'
      - 'app/api/invoices/render/**'
      - 'public/fonts/invoice/**'
      - 'lib/__tests__/fixtures/incoming-validation/**'
      - '.github/workflows/container-runtime.yml'
permissions:
  contents: read
concurrency:
  group: container-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install locked independent report parser for the test only
        run: npm ci --ignore-scripts
      - name: Build current runtime without publishing
        run: docker build --pull --tag bivaro-runtime-smoke .
      - name: Check isolated non-root runtime and retain only synthetic PDF evidence
        shell: bash
        run: |
          trap 'docker rm --force bivaro-runtime-smoke >/dev/null 2>&1 || true' EXIT
          mkdir "${RUNNER_TEMP}/bivaro-own-invoice-container"
          status=0
          docker run --name bivaro-runtime-smoke --network=none --entrypoint sh \
            --mount type=bind,src="$PWD/scripts/container-runtime-smoke.sh",dst=/tmp/container-runtime-smoke.sh,readonly \
            --mount type=bind,src="$PWD/scripts/own-invoice-pdfa/container-smoke.mjs",dst=/tmp/own-invoice-container-smoke.mjs,readonly \
            --mount type=bind,src="$PWD/lib/__tests__/fixtures/incoming-validation",dst=/tmp/validator-fixtures,readonly \
            --mount type=bind,src="$PWD/node_modules/sax",dst=/tmp/smoke-sax,readonly \
            --mount type=bind,src="$PWD/node_modules",dst=/tmp/own-invoice-test/node_modules,readonly \
            bivaro-runtime-smoke /tmp/container-runtime-smoke.sh || status=$?
          docker cp bivaro-runtime-smoke:/tmp/bivaro-own-invoice-container-smoke/. "${RUNNER_TEMP}/bivaro-own-invoice-container/" || true
          exit "$status"
      - name: Verify copied final bytes and render every container PDF page
        env:
          EVIDENCE: ${{ runner.temp }}/bivaro-own-invoice-container
        run: |
          node -e 'const fs=require("node:fs"),c=require("node:crypto"),p=process.env.EVIDENCE,m=require(p+"/manifest.json"); if(m.status!=="passed" || m.platform!=="linux" || m.architecture!==process.arch || c.createHash("sha256").update(fs.readFileSync(p+"/final.pdf")).digest("hex")!==m.finalSha256) throw Error("Invalid native final-byte evidence")'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          mkdir "$EVIDENCE/rendered"
          pdftoppm -scale-to 2000 -png "$EVIDENCE/final.pdf" "$EVIDENCE/rendered/final"
      - name: Retain only synthetic container PDF, manifest and page pixels
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: own-invoice-container-${{ matrix.runner }}
          path: ${{ runner.temp }}/bivaro-own-invoice-container
          if-no-files-found: warn
          retention-days: 1

      - name: Build test-only browser derivative of the exact production runtime
        run: docker build --file Dockerfile.ai-browser --tag bivaro-ai-browser .
      - name: Real PDF AI browser journey with isolated production renderer
        run: docker run --rm --network=none --shm-size=256m bivaro-ai-browser
