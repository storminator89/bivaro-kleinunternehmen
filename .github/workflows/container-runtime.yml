name: Container runtime compatibility
on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.ai-browser'
      - 'Dockerfile.ai-browser.dockerignore'
      - '.dockerignore'
      - 'playwright.ai-pdf.config.ts'
      - 'e2e/ai-receipt-native.spec.ts'
      - 'next.config.ts'
      - 'docker-entrypoint.sh'
      - 'scripts/database-runtime.mjs'
      - 'scripts/upgrade-database.mjs'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/container-runtime-smoke.sh'
      - 'scripts/ai-pdf/**'
      - 'lib/purchase-documents/**'
      - 'lib/ai-provider/**'
      - 'components/purchases/**'
      - 'app/api/purchase-documents/**'
      - 'app/api/settings/ai-provider/**'
      - 'scripts/run-e2e.mjs'
      - 'scripts/e2e-*.mjs'
      - 'scripts/prepare-e2e.mjs'
      - 'lib/prisma.ts'
      - 'lib/password.ts'
      - 'lib/__tests__/fixtures/incoming-validation/**'
      - '.github/workflows/container-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.ai-browser'
      - 'Dockerfile.ai-browser.dockerignore'
      - '.dockerignore'
      - 'playwright.ai-pdf.config.ts'
      - 'e2e/ai-receipt-native.spec.ts'
      - 'next.config.ts'
      - 'docker-entrypoint.sh'
      - 'scripts/database-runtime.mjs'
      - 'scripts/upgrade-database.mjs'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/container-runtime-smoke.sh'
      - 'scripts/ai-pdf/**'
      - 'lib/purchase-documents/**'
      - 'lib/ai-provider/**'
      - 'components/purchases/**'
      - 'app/api/purchase-documents/**'
      - 'app/api/settings/ai-provider/**'
      - 'scripts/run-e2e.mjs'
      - 'scripts/e2e-*.mjs'
      - 'scripts/prepare-e2e.mjs'
      - 'lib/prisma.ts'
      - 'lib/password.ts'
      - 'lib/__tests__/fixtures/incoming-validation/**'
      - '.github/workflows/container-runtime.yml'
permissions:
  contents: read
concurrency:
  group: container-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install locked independent report parser for the test only
        run: npm ci --ignore-scripts
      - name: Build current runtime without publishing
        run: docker build --pull --tag bivaro-runtime-smoke .
      - name: Check isolated non-root runtime and synthetic PDF/database
        run: >-
          docker run --rm --network=none --entrypoint sh
          --mount type=bind,src="$PWD/scripts/container-runtime-smoke.sh",dst=/tmp/container-runtime-smoke.sh,readonly
          --mount type=bind,src="$PWD/lib/__tests__/fixtures/incoming-validation",dst=/tmp/validator-fixtures,readonly
          --mount type=bind,src="$PWD/node_modules/sax",dst=/tmp/smoke-sax,readonly
          bivaro-runtime-smoke /tmp/container-runtime-smoke.sh

      - name: Build test-only browser derivative of the exact production runtime
        run: docker build --file Dockerfile.ai-browser --tag bivaro-ai-browser .
      - name: Real PDF AI browser journey with isolated production renderer
        run: docker run --rm --network=none --shm-size=256m bivaro-ai-browser
