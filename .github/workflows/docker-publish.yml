# =============================================================================
# Docker Publish - Builds and pushes Docker image to Docker Hub on main push
# =============================================================================

name: Docker Publish

on:
  push:
    branches: [main]
    tags: ['v*']

# main and release metadata can both request latest: one shared publisher scope.
# Existing runs without this group are not retroactively serialized.
concurrency:
  group: docker-publish-bivaro-kleinunternehmen
  cancel-in-progress: false
  queue: max

env:
  REGISTRY: docker.io
  # Change this to your Docker Hub username/organization
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/bivaro-kleinunternehmen

jobs:
  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 📋 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # Do not infer a blanket image license from repository detection.
          # The standard aggregate label is deliberately empty; app SPDX is separate.
          labels: |
            org.opencontainers.image.licenses=
            org.bivaro.application.license=Apache-2.0
            org.bivaro.application.license.scope=Application only; third-party components retain their own licenses and source obligations. See /app/THIRD_PARTY_NOTICES.txt.
          tags: |
            # Set latest tag for main branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with branch name
            type=ref,event=branch
            # Tag with full sha
            type=sha,prefix=sha-
            # Tag with version if it's a tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Separate commit/version tags from moving aliases
        id: tags
        uses: actions/github-script@v7
        env:
          METADATA_TAGS: ${{ steps.meta.outputs.tags }}
        with:
          script: |
            const { splitDockerPublishTags } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/docker-publish-policy.mjs`);
            const plan = splitDockerPublishTags({ image: process.env.IMAGE_NAME, metadataTags: process.env.METADATA_TAGS, sha: process.env.GITHUB_SHA, eventName: process.env.GITHUB_EVENT_NAME, ref: process.env.GITHUB_REF });
            core.setOutput('build-tags', plan.buildTags.join('\n'));

      - name: 🏗️ Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.build-tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Promote main-branch aliases only from current main
        uses: actions/github-script@v7
        env:
          METADATA_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        with:
          script: |
            const { splitDockerPublishTags, movingTagPromotionArgs } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/docker-publish-policy.mjs`);
            const image = process.env.IMAGE_NAME;
            const metadataTags = process.env.METADATA_TAGS;
            const sha = process.env.GITHUB_SHA;
            const eventName = process.env.GITHUB_EVENT_NAME;
            const ref = process.env.GITHUB_REF;
            if (!splitDockerPublishTags({ image, metadataTags, sha, eventName, ref }).movingTags.length) return;
            // Read after the build. API/validation failure fails closed, never promotes.
            const { data } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            const args = movingTagPromotionArgs({ image, metadataTags, sha, eventName, ref, currentMainSha: data.object.sha, digest: process.env.IMAGE_DIGEST });
            if (!args.length) {
              core.info('Moving aliases skipped: built commit is no longer current main. Commit/version tags remain published.');
              return;
            }
            // No rebuild: copy the just-published complete multiarchitecture index.
            require('node:child_process').execFileSync('docker', args, { stdio: 'inherit', timeout: 120000 });
