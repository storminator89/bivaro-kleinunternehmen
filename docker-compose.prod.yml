# =============================================================================
# BUCHHALTUNG - Docker Compose Production Overrides
# =============================================================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

services:
  buchhaltung:
    # Use pre-built image from registry (optional)
    # image: ghcr.io/your-org/buchhaltung:latest
    
    restart: always
    
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    
    environment:
      - NODE_ENV=production
    
    # Production logging with rotation
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"

